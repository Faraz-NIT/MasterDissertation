[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "evidence-gated-replenishment"
version = "0.1.0"
description = "Reproducible simulator for evidence-gated retail replenishment"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "pydantic>=2.8,<3", "PyYAML>=6,<7", "httpx>=0.27,<1"]
[project.optional-dependencies]
ml = ["torch>=2.3,<3", "lightgbm>=4.3,<5", "scikit-learn>=1.4,<2"]
foundation = ["chronos-forecasting>=2,<3", "torch>=2.3,<3"]
analysis = ["statsmodels>=0.14,<1", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]
[project.scripts]
ega = "ega.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
[tool.ruff]
line-length = 110
